[build]
  # Compile Nest, then bundle it into netlify/functions/api.mjs (see scripts/bundle-function.mjs).
  command = "npx prisma generate && npm run build && node scripts/bundle-function.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Prisma stays outside the bundle: it needs its native engine file at runtime.
  external_node_modules = ["@prisma/client", ".prisma/client"]
  included_files = [
    "prisma/schema.prisma",
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true
